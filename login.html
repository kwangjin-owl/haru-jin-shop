<main><div class="wrap">
  <h2>로그인</h2>
  <p class="lead">이메일과 비밀번호로 가입하거나 로그인합니다.</p>
  <form class="pay" id="auth-form">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="6자 이상">
    <button class="btn" type="button" id="btn-signup">가입</button>
    <button class="btn" type="button" id="btn-login">로그인</button>
    <button class="linkbtn" type="button" id="btn-reset">비밀번호를 잊으셨나요?</button>
    <button class="btn ghost" type="button" id="btn-logout" data-only-logged-in hidden>로그아웃</button>
    <p class="lead" style="margin:14px 0 0;font-size:12.5px">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 진 빠지는 하루를 다 보신 뒤 로그아웃을 눌러 주세요.</p>
    <p class="auth-status" id="auth-message" role="status" hidden></p>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent-ui.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendEmailVerification,
    sendPasswordResetEmail,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDgF1bZEceFceNmKJiQL1jmG31HIm-bOwA",
    authDomain: "haru-jin-shop.firebaseapp.com",
    projectId: "haru-jin-shop",
    storageBucket: "haru-jin-shop.firebasestorage.app",
    messagingSenderId: "405082377069",
    appId: "1:405082377069:web:50b28f8cf84308faa02864"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // 인증 메일을 한국어로 보낸다
  auth.languageCode = "ko";

  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const messageEl = document.getElementById("auth-message");

  // kind: "ok"(성공) · "err"(실패) · "busy"(처리 중) - 색이 달라 무슨 일이 일어났는지 바로 보인다
  function show(text, kind) {
    messageEl.textContent = text;
    messageEl.className = "auth-status " + (kind || "ok");
    messageEl.hidden = false;
  }

  // 처리하는 동안 단추를 잠가 두 번 눌리지 않게 한다
  const buttons = document.querySelectorAll("#auth-form button");
  function lock(on) { buttons.forEach(b => { b.disabled = on; }); }

  async function run(action, okText) {
    show("처리 중입니다…", "busy");
    lock(true);
    try {
      const cred = await action(auth, emailEl.value.trim(), passwordEl.value);
      show(await okText(cred), "ok");
      // 마이페이지처럼 가려던 화면이 있으면 잠깐 메시지를 보여 준 뒤 보낸다
      const next = new URLSearchParams(location.search).get("next");
      if (next && /^[\w-]+\.html$/.test(next)) setTimeout(() => { location.href = next; }, 1000);
    } catch (err) {
      show(err.code || String(err), "err");
    }
    lock(false);
  }

  document.getElementById("btn-signup").addEventListener("click", () =>
    run(createUserWithEmailAndPassword, async (c) => {
      // ▼ sign_up — 가입이 성공한 직후 한 번만. 이메일·비밀번호는 넣지 않는다
      window.dataLayer = window.dataLayer || [];
      dataLayer.push({
        event: "sign_up",
        method: "email"
      });
      // 인증 메일 보내기가 끝난 뒤에야 다음 화면으로 넘어간다 (실패하면 오류 코드가 보인다)
      await sendEmailVerification(c.user);
      return "✓ 가입했습니다. 인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
    }));

  document.getElementById("btn-login").addEventListener("click", () =>
    run(signInWithEmailAndPassword, (c) => "✓ 로그인했습니다: " + c.user.email));

  document.getElementById("btn-logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      show("✓ 로그아웃했습니다.", "ok");
    } catch (err) {
      show(err.code || String(err), "err");
    }
  });

  // 비밀번호 재설정 메일 - 가입된 주소인지 아닌지 알려 주지 않는다
  document.getElementById("btn-reset").addEventListener("click", async () => {
    const email = emailEl.value.trim();
    if (!email) { show("위 이메일 칸에 주소를 먼저 적어 주세요.", "err"); return; }
    show("처리 중입니다…", "busy");
    lock(true);
    try {
      await sendPasswordResetEmail(auth, email);
      show("메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.", "ok");
    } catch (err) {
      if (err.code === "auth/user-not-found") show("메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.", "ok");
      else show(err.code || String(err), "err");
    }
    lock(false);
  });
</script>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
