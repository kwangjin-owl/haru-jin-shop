<main><div class="wrap">
  <h2>로그인</h2>
  <p class="lead">이메일과 비밀번호로 가입하거나 로그인합니다.</p>
  <form class="pay" id="auth-form">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="6자 이상">
    <button class="btn" type="button" id="btn-signup">가입</button>
    <button class="btn" type="button" id="btn-login">로그인</button>
    <button class="btn ghost" type="button" id="btn-logout">로그아웃</button>
    <p class="lead" style="margin:14px 0 0;font-size:12.5px">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 진 빠지는 하루를 다 보신 뒤 로그아웃을 눌러 주세요.</p>
    <p class="lead" id="auth-message" role="status" style="margin:18px 0 0"></p>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent-ui.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDgF1bZEceFceNmKJiQL1jmG31HIm-bOwA",
    authDomain: "haru-jin-shop.firebaseapp.com",
    projectId: "haru-jin-shop",
    storageBucket: "haru-jin-shop.firebasestorage.app",
    messagingSenderId: "405082377069",
    appId: "1:405082377069:web:50b28f8cf84308faa02864"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const messageEl = document.getElementById("auth-message");

  function show(text) { messageEl.textContent = text; }

  async function run(action, okText) {
    try {
      const cred = await action(auth, emailEl.value.trim(), passwordEl.value);
      show(okText(cred));
      // 마이페이지처럼 가려던 화면이 있으면 잠깐 메시지를 보여 준 뒤 보낸다
      const next = new URLSearchParams(location.search).get("next");
      if (next && /^[\w-]+\.html$/.test(next)) setTimeout(() => { location.href = next; }, 1000);
    } catch (err) {
      show(err.code || String(err));
    }
  }

  document.getElementById("btn-signup").addEventListener("click", () =>
    run(createUserWithEmailAndPassword, (c) => {
      // ▼ sign_up — 가입이 성공한 직후 한 번만. 이메일·비밀번호는 넣지 않는다
      window.dataLayer = window.dataLayer || [];
      dataLayer.push({
        event: "sign_up",
        method: "email"
      });
      return "가입됐습니다: " + c.user.email;
    }));

  document.getElementById("btn-login").addEventListener("click", () =>
    run(signInWithEmailAndPassword, (c) => "로그인됐습니다: " + c.user.email));

  document.getElementById("btn-logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      show("로그아웃됐습니다.");
    } catch (err) {
      show(err.code || String(err));
    }
  });
</script>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
