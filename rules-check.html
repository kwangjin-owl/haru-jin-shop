<main><div class="wrap">
  <h2>규칙 확인</h2>
  <p class="lead" data-only-logged-out hidden>로그인해야 쓸 수 있습니다.</p>
  <div id="rules-box" data-only-logged-in hidden>
    <p style="margin:0 0 4px;font-weight:600">이메일: <span data-auth-email></span></p>
    <p style="margin:0 0 22px;font-weight:600;word-break:break-all">UID: <span id="rules-uid"></span></p>

    <button class="btn" type="button" id="btn-read-orders">주문 전체 읽기</button>
    <div class="rules-result" id="result-read-orders" role="status"></div>

    <button class="btn" type="button" id="btn-fix-order" style="margin-top:22px">내 주문 금액 고치기</button>
    <div class="rules-result" id="result-fix-order" role="status"></div>

    <button class="btn" type="button" id="btn-zero-price" style="margin-top:22px">상품 가격 0원으로</button>
    <div class="rules-result" id="result-zero-price" role="status"></div>

    <button class="btn" type="button" id="btn-ask-total" style="margin-top:22px">서버에게 금액 묻기</button>
    <div class="rules-result" id="result-ask-total" role="status"></div>

    <button class="btn" type="button" id="btn-send-price" style="margin-top:22px">가격 바꿔 보내기</button>
    <div class="rules-result" id="result-send-price" role="status"></div>

    <button class="btn" type="button" id="btn-zero-qty" style="margin-top:22px">수량 0으로 묻기</button>
    <div class="rules-result" id="result-zero-qty" role="status"></div>
  </div>
</div></main>
