<style>
  /* 관리 화면 안에서만 쓰는 모양 - 가게 스타일(style.css)은 건드리지 않는다 */
  #admin-products [hidden]{display:none !important}
  #admin-info p{margin:0 0 6px}
  #admin-info{margin:0 0 18px}
  #products-table{table-layout:auto}
  #products-table th,#products-table td{padding:10px 12px;vertical-align:middle}
  #products-table th.num,#products-table td.num{text-align:right;font-variant-numeric:tabular-nums}
  #products-table th.mid,#products-table td.mid{text-align:center}
  #products-table input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
  #products-table .btn{padding:7px 14px;font-size:13.5px}
  #products-table code{font-size:13px}
  #products-table .thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
  #products-table .thumb-empty{width:48px;height:48px;border-radius:6px;border:1px dashed var(--line);box-sizing:border-box}
  #products-table tr.edit td{background:#f3efe7}
  .edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 16px;align-items:end}
  .edit-grid label{display:block;font-size:13px;color:var(--sub)}
  .edit-grid input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit}
  .edit-actions{display:flex;gap:8px;margin-top:12px}
  .row-msg{display:block;margin-top:6px;color:#b3261e;font-size:13px;white-space:pre-wrap;word-break:break-all}
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
  .filter-buttons{display:flex;gap:8px}
  .filter-buttons .btn{padding:8px 16px;font-size:14px}
  .filter-bar input,.filter-bar select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:var(--ink)}
  .filter-bar input{flex:1;min-width:160px;max-width:260px}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  #undo-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:20;display:flex;gap:12px;align-items:center;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
  #undo-bar[hidden]{display:none}
  #undo-bar .btn{padding:6px 14px;font-size:13.5px;background:#fff;color:var(--ink)}
  #undo-bar .undo-err{color:#ffb4ab;font-size:13px;white-space:pre-wrap;word-break:break-all}
  dialog#takedown-dialog{border:1px solid var(--line);border-radius:12px;padding:22px;max-width:380px;background:var(--card);color:var(--ink)}
  dialog#takedown-dialog::backdrop{background:rgba(0,0,0,.35)}
  dialog#takedown-dialog p{margin:0 0 18px}
  dialog#takedown-dialog .dlg-actions{display:flex;gap:8px;justify-content:flex-end}
  #activity-table th,#activity-table td{padding:10px 12px;vertical-align:middle}
  #activity-table td.when{white-space:nowrap;font-variant-numeric:tabular-nums}
  .tab-bar{display:flex;gap:8px;margin:28px 0 0}
  .tab-bar .btn{padding:8px 20px;font-size:14.5px}
  body[data-tab="orders"] #admin-products,body[data-tab="sales"] #admin-products{display:none !important}
  #admin-orders{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
  #admin-orders[hidden]{display:none}
  #orders-table tbody tr{cursor:pointer}
  #orders-table tbody tr:hover td{background:#f8f4ec}
  #orders-table th.num,#orders-table td.num{text-align:right;font-variant-numeric:tabular-nums}
  #orders-table td.when{white-space:nowrap;font-variant-numeric:tabular-nums}
  .order-detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 18px}
  .order-detail dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0 0 14px}
  .order-detail dt{color:var(--sub);font-size:13.5px}
  .order-detail dd{margin:0;word-break:break-all}
  .order-detail ul{margin:0;padding-left:18px}
  .order-detail .detail-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  dialog#status-dialog{border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;background:var(--card);color:var(--ink)}
  dialog#status-dialog::backdrop{background:rgba(0,0,0,.35)}
  dialog#status-dialog p{margin:0 0 18px;word-break:break-all}
  dialog#status-dialog .dlg-actions{display:flex;gap:8px;justify-content:flex-end}
  #admin-sales{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
  #admin-sales[hidden]{display:none}
  .sales-note{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:0 0 14px}
  .sales-chart{position:relative;height:320px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 18px}
  #sales-table th.num,#sales-table td.num{text-align:right;font-variant-numeric:tabular-nums}
  #sales-table td.when{white-space:nowrap;font-variant-numeric:tabular-nums}
  #sales-table td.none{color:var(--sub)}
  #new-form{margin:0 0 20px}
  #new-form input[type=file]{padding:9px 0;border:0}
</style>

<main><div class="wrap">
  <h2>관리 화면</h2>

  <p class="lead" id="admin-checking">확인 중입니다…</p>

  <!-- 로그인하지 않았을 때 -->
  <div id="admin-logged-out" hidden>
    <p class="lead">로그인이 필요합니다</p>
    <p><a href="/login.html">로그인 화면으로 가기</a></p>
  </div>

  <!-- 로그인했을 때 - 로그인 토큰의 커스텀 클레임 role 로만 판단한다 -->
  <div id="admin-logged-in" hidden>
    <div id="admin-info">
      <p class="lead" id="admin-ok" hidden></p>
      <p class="lead">로그인 : <strong id="admin-email"></strong></p>
      <p class="lead">토큰을 받은 시각 : <strong id="admin-issued"></strong></p>
    </div>
    <div id="admin-denied" hidden>
      <p class="lead">권한이 없습니다</p>
      <button class="btn" type="button" id="btn-grant">주인 명찰 받기</button>
    </div>
    <p class="auth-status err" id="admin-error" role="alert" hidden style="white-space:pre-wrap;word-break:break-all"></p>
    <p style="margin:0"><button class="btn ghost" type="button" id="btn-recheck">다시 확인</button></p>

    <!-- 상품 표 - 입구가 「관리자: staff」 또는 「관리자: admin」 일 때만 보인다 -->
    <div class="tab-bar" id="admin-tabs" role="tablist" hidden>
      <button class="btn" type="button" role="tab" data-tab="products" aria-selected="true">상품</button>
      <button class="btn ghost" type="button" role="tab" data-tab="orders" aria-selected="false">주문</button>
      <button class="btn ghost" type="button" role="tab" data-tab="sales" aria-selected="false">매출</button>
    </div>
    <section id="admin-products" hidden style="margin-top:36px;padding-top:24px;border-top:1px solid var(--line)">
      <h3>상품</h3>
      <p style="margin:0 0 16px"><button class="btn" type="button" id="btn-new">새 상품</button></p>
      <form id="new-form" class="pay" hidden>
        <label for="new-name">name</label>
        <input id="new-name" required>
        <label for="new-price">price</label>
        <input id="new-price" type="number" step="any" required>
        <label for="new-summary">summary</label>
        <input id="new-summary">
        <label for="new-stock">stock</label>
        <input id="new-stock" type="number" step="1" required>
        <label for="new-photo">사진</label>
        <input id="new-photo" type="file" accept="image/*">
        <p class="lead" id="new-progress" role="status" style="margin:6px 0 0"></p>
        <div class="auth-actions">
          <button class="btn" type="submit">저장</button>
          <button class="btn ghost" type="button" id="new-cancel">취소</button>
        </div>
        <p class="auth-status err" id="new-error" role="alert" hidden style="white-space:pre-wrap;word-break:break-all"></p>
      </form>
      <p class="lead" id="products-status" role="status" style="margin:0 0 10px"></p>
      <!-- 필터 · 검색 · 정렬 - 한 번 읽어 둔 것에서 이 화면이 고른다 (Firestore 에 다시 묻지 않는다) -->
      <div class="filter-bar">
        <div class="filter-buttons" role="group" aria-label="필터">
          <button class="btn" type="button" data-filter="all" aria-pressed="true">전체</button>
          <button class="btn ghost" type="button" data-filter="soldout" aria-pressed="false">품절만</button>
          <button class="btn ghost" type="button" data-filter="hidden" aria-pressed="false">숨김만</button>
          <button class="btn ghost" type="button" data-filter="deleted" aria-pressed="false">내린 상품</button>
        </div>
        <input id="products-search" type="search" placeholder="이름 검색" aria-label="이름 검색">
        <select id="products-sort" aria-label="정렬">
          <option value="">읽어 온 순서</option>
          <option value="stock">재고 적은 순</option>
          <option value="name">이름순</option>
          <option value="updated">최근에 고친 순</option>
        </select>
      </div>
      <p class="lead" id="products-count" role="status" style="margin:0 0 10px"></p>
      <div style="overflow-x:auto">
        <table class="cart" id="products-table">
          <thead><tr>
            <th>문서 ID</th><th>사진</th><th>name</th><th class="num">price</th><th class="num">stock</th><th class="mid">품절</th><th class="mid">노출</th><th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <!-- 최근 활동 - 함수가 남기는 adminLogs 를 읽기만 한다 -->
      <div style="margin-top:36px;padding-top:24px;border-top:1px solid var(--line)">
        <h3 style="margin:0 0 10px">최근 활동</h3>
        <p style="margin:0 0 10px"><button class="btn ghost" type="button" id="btn-activity" style="padding:7px 14px;font-size:13.5px">새로 읽기</button></p>
        <p class="lead" id="activity-status" role="status" style="margin:0 0 10px"></p>
        <div style="overflow-x:auto">
          <table class="cart" id="activity-table" hidden>
            <thead><tr><th>시각</th><th>상품</th><th>action</th><th>바뀐 것</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 주문 탭 -->
    <section id="admin-orders" hidden>
      <h3>주문</h3>
      <div class="filter-bar">
        <select id="orders-status" aria-label="주문 상태">
          <option value="">전체</option>
          <option value="paid">paid</option>
          <option value="preparing">preparing</option>
          <option value="shipped">shipped</option>
          <option value="delivered">delivered</option>
          <option value="canceled">canceled</option>
        </select>
      </div>
      <div id="order-detail" class="order-detail" hidden></div>
      <p class="lead" id="orders-message" role="status" style="margin:0 0 10px"></p>
      <div style="overflow-x:auto">
        <table class="cart" id="orders-table" hidden>
          <thead><tr><th>주문 번호</th><th class="num">금액</th><th>상태</th><th>주문 시각</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p style="margin:16px 0 0"><button class="btn ghost" type="button" id="orders-more" hidden>더 보기</button></p>
    </section>

    <!-- 매출 탭 - 집계 문서 dailyStats 만 읽는다 (orders 는 읽지 않는다) -->
    <section id="admin-sales" hidden>
      <h3>매출</h3>
      <p class="sales-note lead" id="sales-note" role="status"></p>
      <div class="sales-chart"><canvas id="sales-chart" aria-label="최근 7일 매출 막대 차트" role="img"></canvas></div>
      <div style="overflow-x:auto">
        <table class="cart" id="sales-table" hidden>
          <thead><tr><th>날짜</th><th class="num">건수</th><th class="num">매출</th><th>센 시각</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
</div></main>
<dialog id="status-dialog">
  <p id="status-text"></p>
  <div class="dlg-actions">
    <button class="btn ghost" type="button" id="status-cancel">그만두기</button>
    <button class="btn" type="button" id="status-ok">바꾸기</button>
  </div>
</dialog>
<dialog id="takedown-dialog">
  <p id="takedown-text"></p>
  <div class="dlg-actions">
    <button class="btn ghost" type="button" id="takedown-cancel">그만두기</button>
    <button class="btn" type="button" id="takedown-ok">내리기</button>

</dialog>
<div id="undo-bar" role="status" hidden>
  <span id="undo-text"></span>
  <button class="btn" type="button" id="undo-btn">되돌리기</button>
  <span class="undo-err" id="undo-err"></span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, addDoc, serverTimestamp, deleteField, query, orderBy, limit, where, startAfter, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDgF1bZEceFceNmKJiQL1jmG31HIm-bOwA",
    authDomain: "haru-jin-shop.firebaseapp.com",
    projectId: "haru-jin-shop",
    storageBucket: "haru-jin-shop.firebasestorage.app",
    messagingSenderId: "405082377069",
    appId: "1:405082377069:web:50b28f8cf84308faa02864"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const grantOwnerRole = httpsCallable(getFunctions(app, "us-central1"), "grantOwnerRole");

  const $ = (id) => document.getElementById(id);
  const btnGrant = $("btn-grant");
  const btnRecheck = $("btn-recheck");

  function showError(err) {
    const el = $("admin-error");
    el.textContent = (err && err.message) ? err.message : String(err);
    el.hidden = false;
  }

  // 로그인 토큰을 읽어 role 클레임으로 판단한다 (refresh 가 true 면 서버에서 새로 받는다)
  async function judge(user, refresh) {
    const result = await user.getIdTokenResult(refresh);
    const role = result.claims.role;
    const ok = role === "staff" || role === "admin";
    $("admin-ok").textContent = "관리자: " + role;
    $("admin-ok").hidden = !ok;
    $("admin-denied").hidden = ok;
    $("admin-email").textContent = user.email;
    $("admin-issued").textContent = seoulTime(result.issuedAtTime);
    // 표는 role 이 staff · admin 일 때만 보인다
    $("admin-products").hidden = !ok;
    // 탭 줄은 staff · admin 일 때만 보인다
    $("admin-tabs").hidden = !ok;
    if (!ok) { $("admin-orders").hidden = true; $("admin-sales").hidden = true; }
    // 처음 한 번만 읽는다 - 「다시 확인」을 눌러도 다시 읽지 않는다
    if (ok && !allProducts) { await loadProducts(); loadActivity(); }
  }

  /* --- 상품 표 --- */
  const db = getFirestore(app);
  const storage = getStorage(app);
  const errText = (err) => (err && err.code ? err.code + " — " : "") + (err && err.message ? err.message : String(err));

  // 읽어 온 상품 전부 [{ id, data }] - 필터 · 검색 · 정렬은 여기서 이 화면이 한다
  let allProducts = null;
  const view = { filter: "all", search: "", sort: "" };

  // 조건 없이 전부 읽는다 (isVisible 이 false 인 것 · 품절도 포함)
  async function loadProducts() {
    const status = $("products-status");
    status.textContent = "불러오는 중입니다…";
    try {
      const snap = await getDocs(collection(db, "products"));
      allProducts = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      status.textContent = "";
      renderProducts();
    } catch (err) {
      status.textContent = errText(err);
    }
  }

  // 읽어 둔 것에서 필터 · 검색 · 정렬을 겹쳐 적용해 표를 다시 그린다
  function renderProducts() {
    if (!allProducts) return;
    const q = view.search.trim().toLowerCase();
    let rows = allProducts.filter(({ data }) => {
      if (view.filter === "soldout" && data.stock !== 0) return false;
      if (view.filter === "hidden" && data.isVisible !== false) return false;
      if (view.filter === "deleted" && !data.deletedAt) return false;
      if (q && !String(data.name || "").toLowerCase().includes(q)) return false;
      return true;
    });
    if (view.sort === "stock") {
      // 숫자가 아닌 재고는 맨 뒤로
      const n = (r) => typeof r.data.stock === "number" ? r.data.stock : Infinity;
      rows = rows.slice().sort((a, b) => (n(a) === n(b) ? 0 : n(a) < n(b) ? -1 : 1));
    } else if (view.sort === "updated") {
      // updatedAt 이 늦은 것이 위, updatedAt 이 없는 것은 맨 아래
      const t = (r) => {
        const u = r.data.updatedAt;
        return u && typeof u.toMillis === "function" ? u.toMillis() : u instanceof Date ? u.getTime() : -Infinity;
      };
      rows = rows.slice().sort((a, b) => (t(a) === t(b) ? 0 : t(a) > t(b) ? -1 : 1));
    } else if (view.sort === "name") {
      rows = rows.slice().sort((a, b) => String(a.data.name || "").localeCompare(String(b.data.name || ""), "ko"));
    }
    const tbody = document.querySelector("#products-table tbody");
    tbody.replaceChildren();
    rows.forEach(r => tbody.append(...productRows(r.id, r.data)));
    $("products-count").textContent = "지금 보이는 상품 " + rows.length + "개 / 전체 " + allProducts.length + "개";
  }

  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
    view.filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x => {
      const on = x === b;
      x.className = on ? "btn" : "btn ghost";
      x.setAttribute("aria-pressed", String(on));
    });
    renderProducts();
  }));
  $("products-search").addEventListener("input", (ev) => { view.search = ev.target.value; renderProducts(); });
  $("products-sort").addEventListener("change", (ev) => { view.sort = ev.target.value; renderProducts(); });

  /* --- 내리기 · 되돌리기 (문서는 지우지 않는다) --- */
  const dlg = $("takedown-dialog");
  let pending = null;
  let undoTarget = null;

  function askTakedown(id, data, showErr) {
    pending = { id, data, showErr };
    $("takedown-text").textContent = "『" + data.name + "』을 가게에서 내립니다";
    dlg.showModal();
  }
  $("takedown-cancel").addEventListener("click", () => { pending = null; dlg.close(); });
  $("takedown-ok").addEventListener("click", async () => {
    const t = pending;
    pending = null;
    dlg.close();
    if (!t) return;
    t.showErr(null);
    try {
      // deletedAt 은 서버 시각, isVisible 은 false
      await updateDoc(doc(db, "products", t.id), { deletedAt: serverTimestamp(), isVisible: false, updatedAt: serverTimestamp() });
      t.data.deletedAt = new Date();
      t.data.isVisible = false;
      t.data.updatedAt = new Date();
      undoTarget = t;
      $("undo-text").textContent = "『" + t.data.name + "』을 내렸습니다";
      $("undo-err").textContent = "";
      $("undo-bar").hidden = false;
      renderProducts();
    } catch (e) {
      t.showErr(e);
    }
  });

  // deletedAt 필드를 아예 지우고 isVisible 을 true 로 저장한다
  async function restoreProduct(id, data, showErr) {
    showErr(null);
    try {
      await updateDoc(doc(db, "products", id), { deletedAt: deleteField(), isVisible: true, updatedAt: serverTimestamp() });
      delete data.deletedAt;
      data.isVisible = true;
      data.updatedAt = new Date();
      renderProducts();
      return true;
    } catch (e) {
      showErr(e);
      return false;
    }
  }
  $("undo-btn").addEventListener("click", async () => {
    if (!undoTarget) return;
    const t = undoTarget;
    $("undo-err").textContent = "";
    const ok = await restoreProduct(t.id, t.data, (e) => { $("undo-err").textContent = e ? errText(e) : ""; });
    if (ok) { undoTarget = null; $("undo-bar").hidden = true; }
  });

  const KEY_LABEL = {
    deletedAt: "내림 표시",
    isVisible: "노출",
    stock: "재고",
    price: "가격",
    name: "이름",
    summary: "설명",
    imagePath: "사진"
  };

  /* --- 최근 활동: adminLogs 를 at 이 최신인 것부터 열 줄 - 읽기만 한다 --- */
  async function loadActivity() {
    const status = $("activity-status");
    status.textContent = "불러오는 중입니다…";
    try {
      const snap = await getDocs(query(collection(db, "adminLogs"), orderBy("at", "desc"), limit(10)));
      const table = $("activity-table");
      const list = table.querySelector("tbody");
      list.replaceChildren();
      snap.docs.forEach(d => {
        const log = d.data();
        const found = allProducts && allProducts.find(r => r.id === log.productId);
        const tr = el("tr");
        const when = log.at && typeof log.at.toDate === "function" ? seoulTime(log.at.toDate()) : "-";
        const cells = [
          [when, "when"],
          [found ? found.data.name : String(log.productId)],
          [String(log.action)],
          [Array.isArray(log.changedKeys) ? log.changedKeys.map(k => KEY_LABEL[k] || k).join(", ") : ""]
        ];
        cells.forEach(([text, cls]) => tr.append(el("td", text, cls ? { className: cls } : undefined)));
        list.append(tr);
      });
      table.hidden = snap.size === 0;
      status.textContent = snap.size === 0 ? "아직 활동이 없습니다" : "";
    } catch (err) {
      status.textContent = errText(err);
    }
  }
  $("btn-activity").addEventListener("click", loadActivity);

  /* --- 탭: 상품(최근 활동 포함) · 주문 --- */
  let ordersLoaded = false;
  let salesLoaded = false;
  document.querySelectorAll("#admin-tabs [data-tab]").forEach(b => b.addEventListener("click", () => {
    const tab = b.dataset.tab;
    document.body.dataset.tab = tab;
    document.querySelectorAll("#admin-tabs [data-tab]").forEach(x => {
      const on = x === b;
      x.className = on ? "btn" : "btn ghost";
      x.setAttribute("aria-selected", String(on));
    });
    $("admin-orders").hidden = tab !== "orders";
    $("admin-sales").hidden = tab !== "sales";
    // 주문 탭을 처음 열 때 처음 20개를 읽는다
    if (tab === "orders" && !ordersLoaded) { ordersLoaded = true; loadOrders(true); }
    // 매출 탭을 처음 열 때 한 번 읽는다
    if (tab === "sales" && !salesLoaded) { salesLoaded = true; loadSales(); }
  }));

  /* --- 주문 목록: createdAt 최근순 20개씩. 상태는 Firestore 에 where 로 물어 읽는다 --- */
  const ORDERS_PAGE = 20;
  const orders = { status: "", last: null, serial: 0 };
  const NEXT_STATUS = {
    paid: { to: "preparing", label: "포장 시작" },
    preparing: { to: "shipped", label: "배송 시작" },
    shipped: { to: "delivered", label: "배송 완료" }
  };
  const when = (ts) => ts && typeof ts.toDate === "function" ? seoulTime(ts.toDate()) : "-";

  async function loadOrders(fresh) {
    const msg = $("orders-message");
    const more = $("orders-more");
    const table = $("orders-table");
    const tbody = table.querySelector("tbody");
    if (fresh) {
      orders.last = null;
      tbody.replaceChildren();
      table.hidden = true;
      more.hidden = true;
      $("order-detail").hidden = true;
    }
    const serial = ++orders.serial;
    msg.textContent = "불러오는 중입니다…";
    try {
      const parts = [collection(db, "orders")];
      if (orders.status) parts.push(where("status", "==", orders.status));
      parts.push(orderBy("createdAt", "desc"));
      if (orders.last) parts.push(startAfter(orders.last));
      parts.push(limit(ORDERS_PAGE));
      const snap = await getDocs(query(...parts));
      // 그 사이 상태를 다시 골랐으면 이 답은 버린다
      if (serial !== orders.serial) return;
      snap.docs.forEach(d => tbody.append(orderRow(d.id, d.data())));
      if (snap.size > 0) orders.last = snap.docs[snap.docs.length - 1];
      table.hidden = tbody.children.length === 0;
      more.hidden = snap.size < ORDERS_PAGE;
      msg.textContent = tbody.children.length === 0 ? "주문이 없습니다" : "";
    } catch (err) {
      // 색인을 만들라는 링크가 그대로 보이도록 오류는 줄이지 않고 콘솔에 남긴다
      console.error(err);
      if (serial === orders.serial) msg.textContent = "주문을 불러오지 못했습니다. 콘솔을 확인해 주세요.";
    }
  }

  function orderRow(id, data) {
    const tr = el("tr");
    tr.append(
      el("td", id),
      el("td", String(data.totalPrice), { className: "num" }),
      el("td", String(data.status)),
      el("td", when(data.createdAt), { className: "when" })
    );
    tr.addEventListener("click", () => showOrder(id));
    return tr;
  }

  $("orders-status").addEventListener("change", (ev) => { orders.status = ev.target.value; loadOrders(true); });
  $("orders-more").addEventListener("click", () => loadOrders(false));

  /* --- 주문 상세 --- */
  async function showOrder(id) {
    const box = $("order-detail");
    box.hidden = false;
    box.textContent = "불러오는 중입니다…";
    try {
      const snap = await getDoc(doc(db, "orders", id));
      if (!snap.exists()) { box.textContent = "그 주문이 없습니다"; return; }
      paintOrder(id, snap.data(), box);
      box.scrollIntoView({ block: "nearest" });
    } catch (err) {
      console.error(err);
      box.textContent = "주문을 불러오지 못했습니다. 콘솔을 확인해 주세요.";
    }
  }

  function paintOrder(id, d, box) {
    box.replaceChildren();
    const dl = el("dl");
    const row = (label, node) => { dl.append(el("dt", label)); const dd = el("dd"); dd.append(node); dl.append(dd); };
    const text = (t) => document.createTextNode(String(t));
    row("주문 번호", text(id));
    const ul = el("ul");
    (Array.isArray(d.items) ? d.items : []).forEach(it => {
      ul.append(el("li", (it.name || it.productId || "-") + " × " + (it.quantity ?? "-") + " (" + (it.price ?? "-") + ")"));
    });
    row("산 것", ul);
    row("금액", text(d.totalPrice));
    row("상태", text(d.status));
    row("받은 시각", text(when(d.receivedAt)));
    row("처리 표시", text(d.processStatus || "-" ));
    if (d.processError) row("처리 오류", text(d.processError));
    if (d.mailStatus) row("메일 표시", text(d.mailStatus));
    if (d.statusUpdatedAt) row("상태를 바꾼 시각", text(when(d.statusUpdatedAt)));
    box.append(dl);

    // 지금 상태에서 다음으로 갈 버튼 하나만 (delivered · canceled 는 없음)
    const next = NEXT_STATUS[d.status];
    if (next) {
      const actions = el("div", undefined, { className: "detail-actions" });
      const btn = el("button", next.label, { type: "button", className: "btn" });
      const err = el("span", undefined, { className: "row-msg" });
      btn.addEventListener("click", () => askStatus(id, next.to, box, err));
      actions.append(btn, err);
      box.append(actions);
    }
  }

  const statusDlg = $("status-dialog");
  let statusPending = null;
  function askStatus(id, to, box, err) {
    statusPending = { id, to, box, err };
    $("status-text").textContent = "주문 " + id + "를 " + to + "로 바꿉니다";
    statusDlg.showModal();
  }
  $("status-cancel").addEventListener("click", () => { statusPending = null; statusDlg.close(); });
  $("status-ok").addEventListener("click", async () => {
    const t = statusPending;
    statusPending = null;
    statusDlg.close();
    if (!t) return;
    t.err.textContent = "";
    try {
      // status 와 statusUpdatedAt 두 필드만, 시각은 서버 시각
      await updateDoc(doc(db, "orders", t.id), { status: t.to, statusUpdatedAt: serverTimestamp() });
      // 고친 뒤 상세를 새로 불러와 새 상태와 다음 버튼을 보여 준다
      await showOrder(t.id);
    } catch (e) {
      console.error(e);
      t.err.textContent = "상태를 바꾸지 못했습니다. 콘솔을 확인해 주세요.";
    }
  });

  /* --- 매출: 집계 문서 dailyStats 만 읽는다. 어제(한국 날짜)부터 거꾸로 7일, 날짜마다 한 장 --- */
  let salesChart = null;

  // 어제부터 거꾸로 7일의 문서 이름(20261028 꼴) - 오래된 날이 앞
  function lastSevenDayIds() {
    const nowSeoul = new Date(Date.now() + 9 * 60 * 60 * 1000);
    const y = nowSeoul.getUTCFullYear(), m = nowSeoul.getUTCMonth(), d = nowSeoul.getUTCDate();
    const ids = [];
    for (let back = 7; back >= 1; back--) {
      const day = new Date(Date.UTC(y, m, d - back));
      ids.push(String(day.getUTCFullYear()) + String(day.getUTCMonth() + 1).padStart(2, "0") + String(day.getUTCDate()).padStart(2, "0"));
    }
    return ids;
  }
  const dayText = (id) => id.slice(0, 4) + "-" + id.slice(4, 6) + "-" + id.slice(6, 8);

  async function loadSales() {
    const note = $("sales-note");
    note.textContent = "불러오는 중입니다…";
    try {
      const ids = lastSevenDayIds();
      const snaps = await Promise.all(ids.map(id => getDoc(doc(db, "dailyStats", id))));
      const days = ids.map((id, i) => ({ id, data: snaps[i].exists() ? snaps[i].data() : null }));
      paintSales(days);
    } catch (err) {
      // 오류는 줄이지 않고 콘솔에 그대로 남기고, 화면에는 한 줄만 보여 준다
      console.error(err);
      note.textContent = "매출을 불러오지 못했습니다. 콘솔을 확인해 주세요.";
    }
  }

  function paintSales(days) {
    // 차트 위 한 줄 - 가장 최근 문서 기준
    const latest = days.slice().reverse().find(d => d.data);
    const note = $("sales-note");
    note.replaceChildren();
    if (latest) {
      note.append(
        el("span", dayText(latest.id) + "까지의 매출입니다 - 매일 00:05에 전날을 셉니다"),
        el("span", "마지막으로 센 시각: " + when(latest.data.countedAt))
      );
    } else {
      note.textContent = "아직 집계가 없습니다 - 매일 00:05에 전날을 셉니다";
    }

    // 막대 차트 - 문서가 없는 날은 null 로 비워 두고 날짜 아래에 「집계 없음」
    if (!window.Chart) {
      console.error(new Error("차트 도구를 불러오지 못했습니다 (chart.js 4.4.1)"));
      note.textContent = "차트를 그리지 못했습니다. 콘솔을 확인해 주세요.";
    } else {
      if (salesChart) salesChart.destroy();
      salesChart = new Chart($("sales-chart"), {
        type: "bar",
        data: {
          labels: days.map(d => d.data ? dayText(d.id).slice(5) : [dayText(d.id).slice(5), "집계 없음"]),
          datasets: [{
            label: "매출",
            data: days.map(d => d.data ? Number(d.data.totalSales) || 0 : null),
            backgroundColor: "#8a5a2b"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { callback: (v) => Number(v).toLocaleString("ko-KR") } } }
        }
      });
    }

    // 차트 아래 표
    const table = $("sales-table");
    const tbody = table.querySelector("tbody");
    tbody.replaceChildren();
    days.forEach(({ id, data }) => {
      const tr = el("tr");
      if (!data) {
        tr.append(el("td", dayText(id)), el("td", "집계 없음", { className: "none" }), el("td", "집계 없음", { className: "none" }), el("td", "집계 없음", { className: "none" }));
      } else {
        const count = String(data.orderCount) + (data.canceledCount !== undefined ? " (취소 " + data.canceledCount + ")" : "");
        tr.append(
          el("td", dayText(id)),
          el("td", count, { className: "num" }),
          el("td", (Number(data.totalSales) || 0).toLocaleString("ko-KR"), { className: "num" }),
          el("td", when(data.countedAt), { className: "when" })
        );
      }
      tbody.append(tr);
    });
    table.hidden = false;
  }

  // 사진을 올리기 전에 고른 파일을 살핀다 - 문제가 있으면 그 글을, 없으면 null
  function photoProblem(file) {
    if (!file) return null;
    if (file.size >= 5 * 1024 * 1024) return "5MB 넘는 사진은 올릴 수 없습니다";
    if (!file.type.startsWith("image/")) return "이미지 파일만 올릴 수 있습니다";
    return null;
  }

  // 고른 파일 그대로 products/문서 ID/main.jpg 에 올린다 (맨 앞에 / 없음). 다 올라가면 경로 글자를 돌려준다
  function uploadPhoto(id, file, onProgress) {
    const path = "products/" + id + "/main.jpg";
    return new Promise((resolve, reject) => {
      const task = uploadBytesResumable(ref(storage, path), file);
      onProgress(0);
      task.on("state_changed",
        (s) => onProgress(Math.round(s.bytesTransferred / s.totalBytes * 100)),
        reject,
        () => resolve(path));
    });
  }

  function el(tag, text, attrs) {
    const e = document.createElement(tag);
    if (text !== undefined) e.textContent = text;
    Object.assign(e, attrs || {});
    return e;
  }

  // 한 상품은 줄 두 개: 보이는 줄 + (고치기를 누르면 열리는) 고치는 칸 줄
  function productRows(id, data) {
    const tr = el("tr");
    const cell = (node, cls) => { const td = el("td"); if (cls) td.className = cls; td.append(node); tr.append(td); return td; };
    const err = el("span");
    err.setAttribute("role", "alert");
    err.className = "row-msg";
    const showErr = (e) => { err.textContent = e ? errText(e) : ""; };

    const soldOut = el("input", undefined, { type: "checkbox", checked: data.stock === 0 });
    const visible = el("input", undefined, { type: "checkbox", checked: data.isVisible === true });
    const stockCell = el("span", String(data.stock));

    cell(el("code", id));
    const thumb = el("img", undefined, { alt: "", className: "thumb" });
    thumb.hidden = true;
    const empty = el("div", undefined, { className: "thumb-empty" });
    const thumbCell = cell(empty);
    thumbCell.append(thumb);
    // 표에 보이려고 내려받는 주소를 그때그때 읽을 뿐, 문서에는 저장하지 않는다
    if (data.imagePath) {
      getDownloadURL(ref(storage, data.imagePath))
        .then(url => { thumb.src = url; thumb.hidden = false; empty.hidden = true; })
        .catch(e => showErr(e));
    }
    cell(el("span", data.name));
    cell(el("span", String(data.price)), "num");
    cell(stockCell, "num");
    cell(soldOut, "mid");
    cell(visible, "mid");
    const editBtn = el("button", "고치기", { type: "button", className: "btn ghost" });
    const actionsBox = el("div", undefined, { className: "row-actions" });
    actionsBox.append(editBtn);
    // 내리기는 아직 내리지 않은 상품에, 되돌리기는 내린 상품에 보인다 (어느 필터에서나)
    if (!data.deletedAt) {
      const takedownBtn = el("button", "내리기", { type: "button", className: "btn ghost" });
      takedownBtn.addEventListener("click", () => askTakedown(id, data, showErr));
      actionsBox.append(takedownBtn);
    } else {
      const restoreBtn = el("button", "되돌리기", { type: "button", className: "btn ghost" });
      restoreBtn.addEventListener("click", () => restoreProduct(id, data, showErr));
      actionsBox.append(restoreBtn);
    }
    const last = cell(actionsBox);
    last.append(err);

    // 품절 토글: 켜면 stock 0, 끄면 재고 숫자(1 이상 정수)를 물어 저장
    soldOut.addEventListener("change", async () => {
      showErr(null);
      const wantOn = soldOut.checked;
      let next = 0;
      if (!wantOn) {
        const answer = prompt("재고를 몇 개로 할까요? (1 이상 정수)");
        const n = answer === null ? NaN : Number(answer.trim());
        if (answer === null || answer.trim() === "" || !Number.isInteger(n) || n < 1) {
          soldOut.checked = true;
          if (answer !== null) showErr(new Error("1 이상의 정수만 넣을 수 있습니다"));
          return;
        }
        next = n;
      }
      soldOut.disabled = true;
      try {
        await updateDoc(doc(db, "products", id), { stock: next, updatedAt: serverTimestamp() });
        data.stock = next;
        data.updatedAt = new Date();
        stockCell.textContent = String(next);
      } catch (e) {
        soldOut.checked = !wantOn;
        showErr(e);
      }
      soldOut.disabled = false;
    });

    // 노출 토글: isVisible 을 true / false 로
    visible.addEventListener("change", async () => {
      showErr(null);
      const want = visible.checked;
      visible.disabled = true;
      try {
        await updateDoc(doc(db, "products", id), { isVisible: want, updatedAt: serverTimestamp() });
        data.isVisible = want;
        data.updatedAt = new Date();
      } catch (e) {
        visible.checked = !want;
        showErr(e);
      }
      visible.disabled = false;
    });

    // 고치기: price · summary · stock
    const editTr = el("tr", undefined, { className: "edit" });
    editTr.hidden = true;
    const editTd = el("td", undefined, { colSpan: 8 });
    const grid = el("div", undefined, { className: "edit-grid" });
    const actions = el("div", undefined, { className: "edit-actions" });
    const fPrice = el("input", undefined, { type: "number", step: "any", value: data.price });
    const fSummary = el("input", undefined, { type: "text", value: data.summary || "" });
    const fStock = el("input", undefined, { type: "number", step: "1", value: data.stock });
    const fPhoto = el("input", undefined, { type: "file", accept: "image/*" });
    const editProgress = el("span");
    editProgress.setAttribute("role", "status");
    editProgress.className = "row-msg";
    editProgress.style.color = "var(--sub)";
    const save = el("button", "저장", { type: "button", className: "btn" });
    const cancel = el("button", "취소", { type: "button", className: "btn ghost" });
    const editErr = el("span");
    editErr.setAttribute("role", "alert");
    editErr.className = "row-msg";
    const lab = (t, input) => { const l = el("label", t); l.append(input); return l; };
    grid.append(lab("price", fPrice), lab("summary", fSummary), lab("stock", fStock), lab("사진", fPhoto));
    actions.append(save, cancel);
    editTd.append(grid, actions, editProgress, editErr);
    editTr.append(editTd);

    editBtn.addEventListener("click", () => { editTr.hidden = !editTr.hidden; });
    cancel.addEventListener("click", () => { editTr.hidden = true; });
    save.addEventListener("click", async () => {
      editErr.textContent = "";
      editProgress.textContent = "";
      showErr(null);
      const price = Number(fPrice.value);
      const stock = Number(fStock.value);
      if (fPrice.value.trim() === "" || !(price > 0)) { editErr.textContent = "price 는 0보다 큰 숫자여야 합니다"; return; }
      if (fStock.value.trim() === "" || !Number.isInteger(stock) || stock < 0) { editErr.textContent = "stock 은 0 이상의 정수여야 합니다"; return; }
      const photo = fPhoto.files[0];
      const problem = photoProblem(photo);
      if (problem) { editErr.textContent = problem; return; }
      save.disabled = true;
      try {
        // 숫자는 숫자로 저장한다 (글자로 저장하지 않는다)
        await updateDoc(doc(db, "products", id), { price: price, summary: fSummary.value, stock: stock, updatedAt: serverTimestamp() });
        if (photo) {
          // 같은 경로에 덮어 올리고, 다 올라간 뒤에만 imagePath 를 저장한다
          const path = await uploadPhoto(id, photo, (n) => { editProgress.textContent = "올리는 중 " + n + " %"; });
          await updateDoc(doc(db, "products", id), { imagePath: path, updatedAt: serverTimestamp() });
        }
        await loadProducts();
      } catch (e) {
        editErr.textContent = errText(e);
        showErr(e);
      }
      save.disabled = false;
    });

    return [tr, editTr];
  }

  // 새 상품: 문서 ID 는 자동, isVisible 은 false, createdAt · updatedAt 은 서버 시각
  $("btn-new").addEventListener("click", () => { $("new-form").hidden = !$("new-form").hidden; });
  $("new-cancel").addEventListener("click", () => { $("new-form").hidden = true; });
  $("new-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const errEl = $("new-error");
    errEl.hidden = true;
    const price = Number($("new-price").value);
    const stock = Number($("new-stock").value);
    const fail = (t) => { errEl.textContent = t; errEl.hidden = false; };
    if (!$("new-name").value.trim()) return fail("name 을 넣어 주세요");
    if ($("new-price").value.trim() === "" || !(price > 0)) return fail("price 는 0보다 큰 숫자여야 합니다");
    if ($("new-stock").value.trim() === "" || !Number.isInteger(stock) || stock < 0) return fail("stock 은 0 이상의 정수여야 합니다");
    const photo = $("new-photo").files[0];
    const problem = photoProblem(photo);
    if (problem) return fail(problem);
    $("new-progress").textContent = "";
    try {
      // 1) 문서를 먼저 만든다 (isVisible false)
      const created = await addDoc(collection(db, "products"), {
        name: $("new-name").value.trim(),
        price: price,
        summary: $("new-summary").value,
        stock: stock,
        isVisible: false,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      // 2) 그 문서 ID 로 사진을 올리고 3) 다 올라간 뒤에 imagePath 를 저장한다
      if (photo) {
        try {
          const path = await uploadPhoto(created.id, photo, (n) => { $("new-progress").textContent = "올리는 중 " + n + " %"; });
          await updateDoc(created, { imagePath: path, updatedAt: serverTimestamp() });
        } catch (e) {
          // 사진이 실패하면 imagePath 는 적지 않는다 - 문서는 만들어진 채로 둔다
          $("new-form").reset();
          await loadProducts();
          return fail(errText(e));
        }
      }
      $("new-form").reset();
      $("new-form").hidden = true;
      await loadProducts();
    } catch (e) {
      fail(errText(e));
    }
  });

  // issuedAtTime 은 UTC 글자(예: "Wed, 28 Oct 2026 03:04:05 GMT")라서 서울 시각으로 바꿔 적는다
  function seoulTime(text) {
    return new Date(text).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", hour12: false });
  }

  onAuthStateChanged(auth, async (user) => {
    $("admin-checking").hidden = true;
    $("admin-logged-out").hidden = !!user;
    $("admin-logged-in").hidden = !user;
    $("admin-error").hidden = true;
    if (!user) return;
    try { await judge(user, false); } catch (err) { showError(err); }
  });

  btnGrant.addEventListener("click", async () => {
    $("admin-error").hidden = true;
    btnGrant.disabled = true;
    try {
      await grantOwnerRole();
      await judge(auth.currentUser, true);
    } catch (err) {
      showError(err);
    }
    btnGrant.disabled = false;
  });

  btnRecheck.addEventListener("click", async () => {
    $("admin-error").hidden = true;
    btnRecheck.disabled = true;
    try { await judge(auth.currentUser, true); } catch (err) { showError(err); }
    btnRecheck.disabled = false;
  });
</script>
</body>
</html>
